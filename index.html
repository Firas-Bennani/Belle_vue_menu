<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu Belle Vue Café &amp; Resto — Bizerte</title>
<meta name="description" content="Menu digital de Belle Vue Café &amp; Resto, Bizerte. Scannez, parcourez la carte et commandez depuis votre table.">
<meta name="theme-color" content="#0A0906">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BELLE VUE — or & noir, rien d'autre
   Or de référence #E4BF5F : la teinte exacte du monogramme.
   La gradation ombre → or → éclat imite la réflexion du métal.
   ============================================================ */
:root{
  --noir:#0A0906; --noir-1:#14110B; --noir-2:#1E1A11; --noir-3:#2A2416;
  --or-ombre:#6B4E17; --or-fonce:#A97F2E; --or:#E4BF5F; --or-clair:#F7E7B4; --or-eclat:#FFF8E1;
  --texte:#F2EDE3; --brume:#A79B84; --brume-2:#8C8170;
  --ligne:rgba(228,191,95,.13); --ligne-2:rgba(228,191,95,.28);

  --or-metal:linear-gradient(115deg,var(--or-ombre),var(--or-fonce) 18%,var(--or) 36%,
             var(--or-eclat) 50%,var(--or) 64%,var(--or-fonce) 82%,var(--or-ombre));
  --or-anneau:conic-gradient(from 210deg,var(--or-ombre),var(--or-fonce) 12%,var(--or) 26%,
              var(--or-eclat) 38%,var(--or) 50%,var(--or-fonce) 68%,var(--or-clair) 82%,var(--or-ombre));

  --topH:62px; --r:16px;
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--noir); color:var(--texte);
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:17px; line-height:1.6; overflow-x:hidden;
  padding-bottom:calc(104px + var(--safe));
}
body.fige{overflow:hidden}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--or);outline-offset:3px;border-radius:6px}
.serif{font-family:'Bodoni Moda',Georgia,serif}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- anneau d'or (signature) ---------- */
.anneau{position:relative;border-radius:50%;background:var(--or-anneau);display:grid;place-items:center;isolation:isolate}
.anneau::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--or-anneau);
  filter:blur(16px);opacity:.32;z-index:-1}
.anneau>*{border-radius:50%;background:var(--noir);display:grid;place-items:center;overflow:hidden}

/* filet or, réutilisé partout comme bordure fine */
.filet-or{position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--or-metal);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
  opacity:.55;pointer-events:none;transition:opacity .25s}

/* ---------- barre haute ---------- */
.top{position:sticky;top:0;z-index:60;background:transparent;border-bottom:1px solid transparent;
  transition:background .35s,border-color .35s,backdrop-filter .35s}
.top.pose{background:rgba(10,9,6,.92);backdrop-filter:blur(16px);border-bottom-color:var(--ligne)}
.top-in{display:flex;align-items:center;gap:13px;padding:11px 18px;max-width:1040px;margin:0 auto}
.top .marque{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.top .anneau{width:38px;height:38px;padding:1.5px;flex:none}
.top .anneau img{width:100%;height:100%;object-fit:cover}
.top b{font-family:'Bodoni Moda',serif;font-weight:600;font-size:18px;letter-spacing:.4px;color:var(--or-clair);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jeton{padding:7px 13px;border-radius:999px;border:1px solid var(--ligne-2);color:var(--or);
  font-size:12px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;white-space:nowrap;flex:none}
.ico-btn{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;
  border:1px solid var(--ligne);background:var(--noir-1);color:var(--brume);transition:.2s}
.ico-btn:hover{color:var(--or);border-color:var(--ligne-2)}

/* ---------- en-tête cinématique ---------- */
.cine{position:relative;height:100svh;min-height:540px;overflow:hidden;background:var(--noir);margin-top:calc(-1 * var(--topH))}
@media(min-width:900px){.cine{height:84vh}}
.cine video,.cine .affiche{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cine .voile-cine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,
  rgba(10,9,6,.62) 0,rgba(10,9,6,.14) 18%,rgba(10,9,6,0) 42%,rgba(10,9,6,.55) 76%,rgba(10,9,6,.94) 92%,var(--noir) 100%)}
.cine .signe{position:absolute;left:0;right:0;bottom:104px;text-align:center;padding:0 24px;pointer-events:none}
.cine .signe h1{font-family:'Bodoni Moda',serif;font-weight:600;font-size:clamp(36px,10vw,56px);margin:0;
  color:var(--or-clair);letter-spacing:.5px;line-height:1.04;text-shadow:0 2px 28px rgba(0,0,0,.75)}
.cine .signe p{margin:11px 0 0;font-size:12px;letter-spacing:.38em;text-transform:uppercase;
  color:var(--or);font-weight:700;text-shadow:0 2px 14px rgba(0,0,0,.8)}
.appel{position:absolute;left:50%;translate:-50% 0;bottom:30px;display:flex;flex-direction:column;align-items:center;
  gap:9px;font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--or);font-weight:700;padding:10px 16px}
.appel svg{width:22px;height:22px;stroke:var(--or);fill:none;stroke-width:1.6;animation:respire 2.4s ease-in-out infinite}
@keyframes respire{0%,100%{transform:translateY(0);opacity:.65}50%{transform:translateY(7px);opacity:1}}
.son{position:absolute;right:16px;bottom:30px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--ligne-2);background:rgba(10,9,6,.55);backdrop-filter:blur(6px)}
.son svg{width:19px;height:19px;stroke:var(--or);fill:none;stroke-width:1.7}

/* bandeau de contact sous la vidéo */
.infos{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;padding:26px 18px 0;position:relative}
.pil{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;font-size:14.5px;
  font-weight:600;color:var(--texte);background:var(--noir-1);border:1px solid var(--ligne);text-decoration:none;transition:.2s}
.pil:hover{border-color:var(--ligne-2);color:var(--or-clair)}
.pil svg{width:16px;height:16px;stroke:var(--or);fill:none;stroke-width:1.6}
.filet{height:1px;max-width:240px;margin:26px auto 0;background:var(--or-metal);
  -webkit-mask:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);
  mask:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)}

/* ---------- recherche ---------- */
.zone-rech{max-width:1040px;margin:0 auto;padding:22px 18px 8px}
.rech{display:flex;align-items:center;gap:12px;background:var(--noir-1);border:1px solid var(--ligne);
  border-radius:14px;padding:0 16px;height:54px;transition:border-color .2s}
.rech:focus-within{border-color:var(--ligne-2)}
.rech svg{width:19px;height:19px;stroke:var(--brume-2);fill:none;stroke-width:1.8;flex:none}
.rech input{flex:1;background:none;border:0;outline:0;color:var(--texte);font-size:16px;min-width:0;font-family:inherit}
.rech input::placeholder{color:var(--brume-2)}
.rech .vider{color:var(--brume-2);font-size:24px;line-height:1;padding:6px;display:none}

/* ---------- rail de catégories ---------- */
.rail{position:sticky;top:var(--topH);z-index:55;background:rgba(10,9,6,.94);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--ligne)}
.rail-in{display:flex;gap:9px;overflow-x:auto;padding:13px 18px;max-width:1040px;margin:0 auto;
  scrollbar-width:none;scroll-behavior:smooth}
.rail-in::-webkit-scrollbar{display:none}
.puce{flex:none;padding:12px 21px;border-radius:999px;font-size:15px;font-weight:600;white-space:nowrap;
  color:var(--brume);background:var(--noir-1);border:1px solid var(--ligne);transition:.2s}
.puce:hover{color:var(--texte);border-color:var(--ligne-2)}
.puce[aria-current="true"]{color:#241A05;background:var(--or-metal);border-color:transparent;font-weight:800}

/* ---------- sommaire : tuiles ---------- */
main{max-width:1040px;margin:0 auto;padding:0 18px}
.groupe{margin-top:44px}
.oeil{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.oeil span{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--or-fonce);font-weight:700;flex:none}
.oeil i{flex:1;height:1px;background:linear-gradient(90deg,var(--ligne-2),transparent)}
.grille{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(min-width:700px){.grille{grid-template-columns:repeat(3,1fr)}}

.tuile{position:relative;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;display:block;width:100%;
  text-align:left;background:var(--noir-1);transition:transform .25s}
.tuile:hover{transform:translateY(-3px)}
.tuile:hover .filet-or{opacity:1}
.tuile .fond{position:absolute;inset:0}
.tuile .fond img{width:100%;height:100%;object-fit:cover}
.tuile .voile{position:absolute;inset:0;background:linear-gradient(to top,
  rgba(10,9,6,.95) 6%,rgba(10,9,6,.72) 38%,rgba(10,9,6,.18) 72%,rgba(10,9,6,.35))}
.tuile .ico{position:absolute;top:13px;left:13px;width:26px;height:26px;stroke:var(--or);fill:none;
  stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.tuile .txt{position:absolute;left:0;right:0;bottom:0;padding:16px 15px}
.tuile .txt b{display:block;font-family:'Bodoni Moda',serif;font-weight:600;font-size:20px;line-height:1.15;
  color:var(--or-clair)}
.tuile .txt small{display:block;margin-top:6px;font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;
  color:var(--brume-2);font-weight:700}

/* ---------- placeholder or (aucune photo) ---------- */
.ph{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;
  background:
    radial-gradient(circle at var(--x,50%) var(--y,32%),rgba(228,191,95,.16),transparent 62%),
    linear-gradient(var(--a,120deg),#100D08,#1C1710 46%,#100D08);}
.ph span{font-family:'Bodoni Moda',Georgia,serif;font-weight:500;color:var(--or);
  font-size:var(--taille,32px);line-height:1;opacity:.55;letter-spacing:.02em;
  background:var(--or-metal);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ph::before{content:"";position:absolute;inset:9%;border:1px solid rgba(228,191,95,.22);border-radius:4px}

/* ---------- sections ---------- */
.section{padding-top:48px;scroll-margin-top:132px}
.tete{display:flex;align-items:baseline;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.tete h2{font-family:'Bodoni Moda',serif;font-weight:600;font-size:clamp(30px,8vw,40px);margin:0;
  color:var(--or-clair);line-height:1.1}
.tete em{font-style:normal;font-size:12px;color:var(--brume-2);font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.sous-titre{color:var(--brume-2);font-size:14.5px;margin:0 0 18px}

.plat{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--ligne);
  width:100%;text-align:left;align-items:flex-start}
.plat:last-child{border-bottom:0}
.plat:hover .titre{color:var(--or-clair)}
.plat:hover .filet-or{opacity:.95}
.vign{width:86px;height:86px;border-radius:13px;flex:none;overflow:hidden;position:relative;background:var(--noir-2)}
.vign img{width:100%;height:100%;object-fit:cover}
img.vraie{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.corps{flex:1;min-width:0;padding-top:2px}
.titre{font-size:19px;font-weight:600;line-height:1.28;margin:0;transition:color .18s;letter-spacing:.1px}
.desc{color:var(--brume);font-size:14.5px;line-height:1.5;margin:5px 0 0;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.prix{font-weight:700;font-size:18px;color:var(--or);white-space:nowrap;flex:none;padding-top:3px;
  font-variant-numeric:tabular-nums;letter-spacing:.2px}
.etiq{display:inline-block;margin-left:9px;font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  padding:3px 9px;border-radius:5px;vertical-align:3px;background:rgba(228,191,95,.13);color:var(--or);
  border:1px solid var(--ligne)}
.compteur{display:inline-block;margin-top:9px;font-size:12px;font-weight:800;color:var(--or);letter-spacing:.08em}

.vide{text-align:center;padding:70px 20px;color:var(--brume-2);font-size:15px}
.vide b{display:block;font-family:'Bodoni Moda',serif;font-size:26px;color:var(--or-clair);margin-bottom:8px;font-weight:500}

/* ---------- pied ---------- */
footer{margin-top:64px;padding:44px 18px calc(48px + var(--safe));text-align:center;
  border-top:1px solid var(--ligne);background:linear-gradient(180deg,transparent,rgba(228,191,95,.045))}
footer .anneau{width:74px;height:74px;padding:2px;margin:0 auto 20px}
footer .anneau img{width:100%;height:100%;object-fit:cover}
footer p{color:var(--brume-2);font-size:14px;margin:6px 0}
footer .merci{font-family:'Bodoni Moda',serif;font-size:20px;color:var(--or-clair);margin-bottom:20px;font-weight:400}
.socios{display:flex;justify-content:center;gap:11px;margin:24px 0 8px}
.socios a{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
  border:1px solid var(--ligne);background:var(--noir-1);transition:.2s}
.socios a:hover{border-color:var(--ligne-2)}
.socios svg{width:19px;height:19px;stroke:var(--brume);fill:none;stroke-width:1.7}
.socios a:hover svg{stroke:var(--or)}

/* ---------- barre de sélection ---------- */
.barre{position:fixed;left:0;right:0;bottom:0;z-index:70;padding:14px 18px calc(14px + var(--safe));
  background:linear-gradient(180deg,transparent,rgba(10,9,6,.94) 26%);
  transform:translateY(140%);transition:transform .34s cubic-bezier(.22,1,.36,1);pointer-events:none}
.barre.on{transform:none;pointer-events:auto}
.barre-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:13px;padding:11px 13px 11px 19px;
  border-radius:16px;background:var(--or-metal);color:#241A05;box-shadow:0 16px 38px rgba(0,0,0,.55)}
.barre-in .info{flex:1;min-width:0}
.barre-in .info b{display:block;font-size:15.5px;font-weight:800;line-height:1.2}
.barre-in .info small{font-size:13px;font-weight:700;opacity:.75}
.barre-in .go{background:var(--noir);color:var(--or-clair);font-weight:700;font-size:14.5px;
  padding:13px 19px;border-radius:11px;white-space:nowrap}

/* ---------- panneaux ---------- */
.voile{position:fixed;inset:0;z-index:90;background:rgba(4,3,2,.78);backdrop-filter:blur(5px);
  opacity:0;pointer-events:none;transition:opacity .3s}
.voile.on{opacity:1;pointer-events:auto}
.panneau{position:fixed;left:0;right:0;bottom:0;z-index:95;max-height:90vh;display:flex;flex-direction:column;
  background:var(--noir-1);border-radius:26px 26px 0 0;border-top:1px solid var(--ligne-2);
  transform:translateY(100%);transition:transform .36s cubic-bezier(.22,1,.36,1);
  max-width:620px;margin:0 auto;overflow:hidden}
.panneau.on{transform:none}
.poignee{width:42px;height:4px;border-radius:99px;background:rgba(228,191,95,.3);margin:12px auto 0;flex:none}
.panneau-corps{overflow-y:auto;padding:20px 22px calc(24px + var(--safe));-webkit-overflow-scrolling:touch}
.photo{width:100%;aspect-ratio:16/10;border-radius:16px;overflow:hidden;background:var(--noir-2);
  margin-bottom:20px;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.panneau h3{font-family:'Bodoni Moda',serif;font-weight:600;font-size:28px;margin:0 0 8px;
  color:var(--or-clair);line-height:1.15}
.panneau .p-desc{color:var(--brume);font-size:15.5px;line-height:1.6;margin:0 0 20px}
.p-prix{font-size:26px;font-weight:700;color:var(--or);font-variant-numeric:tabular-nums}
.qte{display:flex;align-items:center;gap:18px;background:var(--noir-2);border-radius:13px;padding:8px 10px}
.qte button{width:38px;height:38px;border-radius:10px;background:var(--noir-3);color:var(--or-clair);
  font-size:21px;font-weight:600;display:grid;place-items:center;line-height:1}
.qte button:disabled{opacity:.32}
.qte b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-size:17px}
.gros{display:block;width:100%;margin-top:20px;padding:17px;border-radius:14px;font-size:16px;font-weight:800;
  background:var(--or-metal);color:#241A05}
.plat-lig{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--ligne)}
.plat-lig .n{flex:1;min-width:0}
.plat-lig .n b{display:block;font-size:15.5px;font-weight:600;line-height:1.3}
.plat-lig .n small{color:var(--brume-2);font-size:13px;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:22px;padding-top:18px;
  border-top:1px solid var(--ligne-2)}
.total span{font-size:12.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--or-fonce);font-weight:700}
.total b{font-family:'Bodoni Moda',serif;font-size:32px;color:var(--or-clair);font-weight:600;font-variant-numeric:tabular-nums}
.note{margin-top:16px;font-size:12.5px;color:var(--brume-2);text-align:center;line-height:1.55}
.second{display:block;width:100%;margin-top:10px;padding:15px;border-radius:13px;font-size:15px;font-weight:600;
  border:1px solid var(--ligne);color:var(--texte);background:var(--noir-2)}

/* bouton intermédiaire : bronze, entre le noir et l'or */
.bronze{display:block;width:100%;margin-top:10px;padding:16px;border-radius:13px;font-size:15.5px;font-weight:700;
  color:var(--or-clair);border:1px solid rgba(228,191,95,.34);letter-spacing:.2px;
  background:linear-gradient(115deg,#1B1710,#3E2F13 34%,#6B4E17 52%,#3E2F13 70%,#1B1710);
  transition:filter .2s,border-color .2s}
.bronze:hover{filter:brightness(1.22);border-color:rgba(228,191,95,.6)}

/* formulaire de commande */
.champ{margin-top:16px}
.champ label{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--or-fonce);font-weight:700;margin-bottom:7px}
.champ input{width:100%;height:54px;padding:0 16px;border-radius:13px;font-size:17px;font-family:inherit;
  color:var(--texte);background:var(--noir-2);border:1px solid var(--ligne);outline:0;transition:border-color .2s}
.champ input::placeholder{color:var(--brume-2)}
.champ input:focus{border-color:var(--ligne-2)}
.champ input[aria-invalid="true"]{border-color:#C4703A}
.err{margin:8px 0 0;font-size:13.5px;color:#E0A06E;min-height:1px}
.recap{margin-top:20px;padding:16px;border-radius:14px;background:var(--noir-2);border:1px solid var(--ligne)}
.recap .l{display:flex;justify-content:space-between;gap:14px;font-size:14.5px;padding:4px 0;color:var(--brume)}
.recap .l b{color:var(--texte);font-weight:600}
.recap .s{display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--ligne);font-size:16px;color:var(--or);font-weight:700}
.champ textarea{width:100%;min-height:86px;padding:14px 16px;border-radius:13px;font-size:17px;font-family:inherit;
  line-height:1.5;color:var(--texte);background:var(--noir-2);border:1px solid var(--ligne);outline:0;resize:vertical}
.champ textarea::placeholder{color:var(--brume-2)}
.champ textarea:focus{border-color:var(--ligne-2)}
.champ textarea[aria-invalid="true"]{border-color:#C4703A}

/* ardoise : la sélection lue par le serveur, à bout de bras */
.ard-t{font-family:'Bodoni Moda',serif;font-weight:600;font-size:30px;color:var(--or-clair);margin:0 0 4px;line-height:1.1}
.ard-s{font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--or-fonce);font-weight:700;margin:0 0 20px}
.ard-l{display:flex;align-items:baseline;gap:14px;padding:16px 0;border-bottom:1px solid var(--ligne)}

   ============================================================ */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt  = n => n.toFixed(2).replace('.',',') + ' ' + CONFIG.devise;
const sansAccents = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

/* hash stable : deux plats voisins n'ont pas le même reflet,
   mais un plat garde le sien d'un chargement à l'autre */
function empreinte(txt){
  let h = 0;
  for (let i = 0; i < txt.length; i++) h = (h * 31 + txt.charCodeAt(i)) | 0;
  return Math.abs(h);
}

/* image d'un plat : la vraie photo si elle existe, sinon le placeholder or */
function visuel(nom, img, taille){
  const h = empreinte(nom);
  const a = 60 + h % 120;          // angle du balayage métallique
  const x = 28 + h % 45;           // position du reflet
  const y = 22 + (h >> 3) % 35;
  const plaque = `<div class="ph" role="img" aria-label="${esc(nom)}"
    style="--a:${a}deg;--x:${x}%;--y:${y}%;--taille:${taille}px"><span>${esc(nom.trim()[0])}</span></div>`;
  // la plaque or reste dessous : si la photo manque ou ne charge pas, elle réapparaît seule
  if (!img) return plaque;
  return plaque + `<img class="vraie" src="${esc(img)}" alt="${esc(nom)}" loading="lazy" onerror="this.remove()">`;
}

/* identifiants figés une fois pour toutes : ce sont les clés de la feuille Google */
CARTE.forEach(g => g.cats.forEach(c => c.plats.forEach((p,i) => {
  p.id = c.id + '-' + i; p.cat = c.nom;
})));

let CATS = [], INDEX = {};

const table = new URLSearchParams(location.search).get('table');
if (table) { const j = $('#jeton-table'); j.hidden = false; j.textContent = 'Table ' + table; }

/* ============================================================
   5. RENDU
   ============================================================ */
let obs = null;

function rendre(){
  /* on écarte les articles marqués indisponibles, et les rubriques devenues vides */
  CATS = CARTE.flatMap(g => g.cats)
              .map(c => Object.assign({}, c, {plats: c.plats.filter(p => !p.off)}))
              .filter(c => c.plats.length);
  INDEX = {};
  CATS.forEach(c => c.plats.forEach(p => { p.cat = c.nom; INDEX[p.id] = p; }));

  /* une sélection peut contenir un plat retiré de la carte entre-temps */
  [...panier.keys()].forEach(id => { if (!INDEX[id]) panier.delete(id); });

  $('#rail').innerHTML = CATS.map(c =>
    `<button class="puce" data-va="${c.id}">${esc(c.nom)}</button>`).join('');

  const groupes = CARTE
    .map(g => ({groupe: g.groupe, cats: g.cats.filter(c => CATS.some(x => x.id === c.id))}))
    .filter(g => g.cats.length);

  $('#sommaire').innerHTML = groupes.map(g => `
    <section class="groupe">
      <div class="oeil"><span>${esc(g.groupe)}</span><i></i></div>
      <div class="grille">${g.cats.map(c => {
        const vue = CATS.find(x => x.id === c.id);
        const vitrine = c.vitrine || (vue.plats.find(p => p.img) || {}).img || '';
        return `<button class="tuile" data-va="${c.id}">
          <div class="fond">${visuel(c.nom, vitrine, 62)}</div>
          <div class="voile"></div>
          <svg class="ico" viewBox="0 0 24 24">${ICONES[c.icone] || ICONES.cafe}</svg>
          <div class="txt">
            <b>${esc(c.nom)}</b>
            <small>${vue.plats.length} article${vue.plats.length > 1 ? 's' : ''}</small>
          </div>
          <span class="filet-or"></span>
        </button>`;
      }).join('')}</div>
    </section>`).join('');

  $('#carte').innerHTML = CATS.map(c => `
    <section class="section" id="s-${c.id}">
      <div class="tete"><h2>${esc(c.nom)}</h2><em>${c.plats.length} article${c.plats.length>1?'s':''}</em></div>
      ${c.intro ? `<p class="sous-titre">${esc(c.intro)}</p>` : '<div style="height:12px"></div>'}
      <div class="liste">${c.plats.map(p => ligne(p)).join('')}</div>
    </section>`).join('');

  if (obs) obs.disconnect();
  obs = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      const id = en.target.id.slice(2);
      $$('.puce').forEach(p => p.setAttribute('aria-current', String(p.dataset.va === id)));
      const act = $(`.puce[data-va="${id}"]`);
      if (act) {
        const r = $('#rail');
        r.scrollTo({left: act.offsetLeft - r.clientWidth/2 + act.clientWidth/2, behavior:'smooth'});
      }
    });
  }, {rootMargin:'-140px 0px -70% 0px'});
  $$('.section').forEach(s => obs.observe(s));

  if (rech.value.trim()) rech.dispatchEvent(new Event('input'));
  rafraichir();
}

function ligne(p){
  return `<button class="plat" data-plat="${p.id}" data-rech="${esc(sansAccents(p.n+' '+(p.d||'')+' '+p.cat))}">
    <div class="vign">${visuel(p.n, p.img, 30)}<span class="filet-or"></span></div>
    <div class="corps">
      <p class="titre">${esc(p.n)}${p.t ? `<span class="etiq">${esc(p.t)}</span>` : ''}</p>
      ${p.d ? `<p class="desc">${esc(p.d)}</p>` : ''}
      <span class="compteur" data-c="${p.id}" hidden></span>
    </div>
    <span class="prix">${dt(p.p)}</span>
  </button>`;
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-va]');
  if (b) document.getElementById('s-'+b.dataset.va)?.scrollIntoView({behavior:'smooth',block:'start'});
});

/* ============================================================
   7. RECHERCHE
   ============================================================ */
const rech = $('#rech');
rech.addEventListener('input', () => {
  const q = sansAccents(rech.value.trim());
  $('#vider').style.display = q ? 'block' : 'none';
  $('#sommaire').hidden = !!q;
  let total = 0;
  $$('.section').forEach(sec => {
    let n = 0;
    sec.querySelectorAll('.plat').forEach(el => {
      const ok = !q || el.dataset.rech.includes(q);
      el.style.display = ok ? '' : 'none';
      if (ok) n++;
    });
    sec.hidden = n === 0;
    total += n;
  });
  $('#vide').hidden = total > 0;
});
$('#vider').addEventListener('click', () => { rech.value=''; rech.dispatchEvent(new Event('input')); rech.focus(); });

/* ============================================================
   8. PANNEAUX
   ============================================================ */
let ouvert = null;
function ouvrir(sel){
  fermer();
  ouvert = $(sel); ouvert.classList.add('on');
  $('#voile').classList.add('on'); document.body.classList.add('fige');
}
function fermer(){
  if (ouvert) ouvert.classList.remove('on');
  ouvert = null;
  $('#voile').classList.remove('on'); document.body.classList.remove('fige');
}
$('#voile').addEventListener('click', fermer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') fermer(); });

/* ============================================================
   9. SÉLECTION (en mémoire, rien n'est enregistré)
   ============================================================ */
const panier = new Map();

function ajouter(id, n){
  const q = (panier.get(id) || 0) + n;
  if (q > 0) panier.set(id, q); else panier.delete(id);
  rafraichir();
}
const totalQte  = () => [...panier.values()].reduce((a,b)=>a+b,0);
const totalPrix = () => [...panier].reduce((a,[id,q]) => a + INDEX[id].p * q, 0);

function rafraichir(){
  const n = totalQte();
  $('#barre').classList.toggle('on', n > 0);
  $('#barre-n').textContent = n + ' article' + (n > 1 ? 's' : '');
  $('#barre-t').textContent = dt(totalPrix());
  $$('[data-c]').forEach(el => {
    const q = panier.get(el.dataset.c);
    el.hidden = !q;
    el.textContent = q ? '× ' + q + ' sélectionné' + (q > 1 ? 's' : '') : '';
  });
  if (ouvert && ouvert.id === 'p-panier' && vue === 'liste') dessinerPanier();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-plat]');
  if (!b) return;
  const p = INDEX[b.dataset.plat];
  let q = panier.get(p.id) || 1;
  const corps = $('#p-plat-corps');

  const dessine = () => {
    corps.innerHTML = `
      <div class="photo">${visuel(p.n, p.img, 92)}<span class="filet-or"></span></div>
      <h3 id="p-plat-titre">${esc(p.n)}</h3>
      ${p.d ? `<p class="p-desc">${esc(p.d)}</p>` : '<div style="height:10px"></div>'}
      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
        <span class="p-prix">${dt(p.p)}</span>
        <div class="qte">
          <button id="moins" aria-label="Retirer un">−</button><b>${q}</b><button id="plus" aria-label="Ajouter un">+</button>
        </div>
      </div>
      <button class="gros" id="ok">Ajouter · ${dt(p.p * q)}</button>
      <p class="note">La sélection sert à préparer votre commande. Le serveur la confirme à table.</p>`;
    corps.querySelector('#moins').disabled = q <= 1;
    corps.querySelector('#moins').onclick = () => { if (q > 1) { q--; dessine(); } };
    corps.querySelector('#plus').onclick  = () => { q++; dessine(); };
    corps.querySelector('#ok').onclick    = () => { panier.set(p.id, q); rafraichir(); fermer(); };
  };
  dessine();
  ouvrir('#p-plat');
});

/* écran affiché : liste, ardoise pour le serveur, ou formulaire de commande */
let vue = 'liste';
const client = { prenom:'', nom:'', tel:'', adresse:'' };

const lignesCommande = () =>
  [...panier].map(([id,q]) => `${q} × ${INDEX[id].n} — ${dt(INDEX[id].p*q)}`).join('\n');

function dessinerPanier(){
  if (vue === 'ardoise')  return dessinerArdoise();
  if (vue === 'commande') return dessinerCommande();
  const corps = $('#p-panier-corps');
  if (!panier.size) { corps.innerHTML = `<div class="vide"><b>Votre sélection est vide</b>Touchez un plat pour l'ajouter.</div>`; return; }
  corps.innerHTML = `
    <h3>Ma sélection${table ? ' · Table ' + esc(table) : ''}</h3>
    <div>${[...panier].map(([id,q]) => {
      const p = INDEX[id];
      return `<div class="plat-lig">
        <div class="n"><b>${esc(p.n)}</b><small>${dt(p.p)} · ${esc(p.cat)}</small></div>
        <div class="qte"><button data-m="${id}" aria-label="Retirer un">−</button><b>${q}</b><button data-p="${id}" aria-label="Ajouter un">+</button></div>
      </div>`;
    }).join('')}</div>
    <div class="total"><span>Total</span><b>${dt(totalPrix())}</b></div>
    <button class="gros" id="serv">Appeler le serveur</button>
    <button class="bronze" id="cmd">Passer une commande</button>
    <button class="second" id="raz">Tout effacer</button>
    <p class="note">Prix en dinars, service compris. Cette sélection n'est pas une commande tant que le serveur ne l'a pas confirmée.</p>`;

  corps.querySelectorAll('[data-m]').forEach(b => b.onclick = () => ajouter(b.dataset.m, -1));
  corps.querySelectorAll('[data-p]').forEach(b => b.onclick = () => ajouter(b.dataset.p,  1));
  corps.querySelector('#serv').onclick = () => { vue = 'ardoise';  dessinerArdoise();  };
  corps.querySelector('#cmd').onclick  = () => { vue = 'commande'; dessinerCommande(); };
  corps.querySelector('#raz').onclick  = () => { panier.clear(); rafraichir(); fermer(); };
}

/* ---- ardoise : gros caractères, à montrer au serveur qui arrive ---- */

  const corps = $('#p-panier-corps');
  corps.innerHTML = `
    <p class="ard-t">Commande${table ? ' · Table ' + esc(table) : ''}</p>
    <p class="ard-s">${totalQte()} article${totalQte() > 1 ? 's' : ''}</p>
    <div>${[...panier].map(([id,q]) => {

      return `<div class="ard-l">

      </div>`;
    }).join('')}</div>
    <div class="ard-tot"><span>Total</span><b>${dt(totalPrix())}</b></div>
    <button class="gros" id="a-ping">Prévenir le serveur</button>

/* ---- « Passer une commande » : coordonnées, adresse, puis envoi WhatsApp ---- */
function dessinerCommande(){
  const corps = $('#p-panier-corps');
  corps.innerHTML = `
    <h3>Vos coordonnées</h3>
    <p class="p-desc">Le restaurant vous rappelle si besoin. Rien n'est enregistré sur ce site.</p>

    <div class="champ">
      <label for="c-prenom">Prénom</label>
      <input id="c-prenom" type="text" autocomplete="given-name" placeholder="Ahmed" value="${esc(client.prenom)}">
    </div>
    <div class="champ">
      <label for="c-nom">Nom</label>
      <input id="c-nom" type="text" autocomplete="family-name" placeholder="Ben Ali" value="${esc(client.nom)}">
    </div>
    <div class="champ">
      <label for="c-tel">Numéro de téléphone</label>
      <input id="c-tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="98 123 456" value="${esc(client.tel)}">
    </div>
    <div class="champ">
      <label for="c-adr">Adresse de livraison</label>
      <textarea id="c-adr" autocomplete="street-address" placeholder="Rue, immeuble, étage, repère — Bizerte">${esc(client.adresse)}</textarea>
    </div>
    <p class="err" id="c-err" role="alert"></p>

    <div class="recap">
      ${[...panier].map(([id,q]) => {
        const p = INDEX[id];
        return `<div class="l"><b>${q} × ${esc(p.n)}</b><span>${dt(p.p*q)}</span></div>`;
      }).join('')}
      <div class="s"><span>Total</span><span>${dt(totalPrix())}</span></div>
    </div>

    <button class="gros" id="c-ok">Confirmer la commande</button>
    <button class="second" id="c-retour">Revenir en arrière</button>`;

  const p = corps.querySelector('#c-prenom'), n = corps.querySelector('#c-nom'),
        t = corps.querySelector('#c-tel'),    a = corps.querySelector('#c-adr');
  p.oninput = () => client.prenom  = p.value;
  n.oninput = () => client.nom     = n.value;
  t.oninput = () => client.tel     = t.value;
  a.oninput = () => client.adresse = a.value;
  corps.querySelector('#c-retour').onclick = () => { vue = 'liste'; dessinerPanier(); };
  corps.querySelector('#c-ok').onclick     = () => confirmerCommande(corps);
  p.focus();
}

function confirmerCommande(corps){
  const err = corps.querySelector('#c-err');
  const champs = {
    prenom:  corps.querySelector('#c-prenom'),
    nom:     corps.querySelector('#c-nom'),
    tel:     corps.querySelector('#c-tel'),
    adresse: corps.querySelector('#c-adr')
  };
  Object.values(champs).forEach(c => c.removeAttribute('aria-invalid'));

  const chiffres = client.tel.replace(/\D/g, '');
  let souci = null;
  if (client.prenom.trim().length < 2)       souci = ['prenom',  'Indiquez votre prénom.'];
  else if (client.nom.trim().length < 2)     souci = ['nom',     'Indiquez votre nom.'];
  else if (chiffres.length < 8)              souci = ['tel',     'Le numéro doit comporter au moins 8 chiffres.'];
  else if (chiffres.length > 15)             souci = ['tel',     'Ce numéro comporte trop de chiffres.'];
  else if (client.adresse.trim().length < 8) souci = ['adresse', "Précisez l'adresse de livraison."];

  if (souci) {
    err.textContent = souci[1];
    champs[souci[0]].setAttribute('aria-invalid', 'true');
    champs[souci[0]].focus();
    return;
  }
  err.textContent = '';

  const nomComplet = `${client.prenom.trim()} ${client.nom.trim()}`.replace(/\s+/g, ' ');
  const adresse    = client.adresse.trim().replace(/\s*\n\s*/g, ', ');
  const txt =
    `Bonjour, je m'appelle ${nomComplet}, voilà mon numéro ${client.tel.trim()}, voici ma commande :\n\n` +
    `${lignesCommande()}\n\nTotal : ${dt(totalPrix())}\nAdresse : ${adresse}`;

  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(txt)}`, '_blank');
  vue = 'liste';
  fermer();
}

$('#barre-go').addEventListener('click', () => { vue = 'liste'; dessinerPanier(); ouvrir('#p-panier'); });

function envoyer(){
  const lignes = [...panier].map(([id,q]) => `${q} × ${INDEX[id].n} — ${dt(INDEX[id].p*q)}`).join('\n');
  const txt = `Commande ${CONFIG.nom}\n${table ? 'Table ' + table : 'Sur place'}\n\n${lignes}\n\nTotal : ${dt(totalPrix())}`;
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(txt)}`, '_blank');
}
function appeler(){
  const txt = `Bonjour, ${table ? 'table ' + table : 'un client'} demande le serveur.`;
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(txt)}`, '_blank');
}

/* ============================================================
   10. EN-TÊTE CINÉMATIQUE
   ============================================================ */
const film = $('#film');

/* la barre du haut ne s'opacifie qu'une fois la vidéo dépassée */
new IntersectionObserver(([e]) => $('.top').classList.toggle('pose', !e.isIntersecting),
  {rootMargin: '-60px 0px 0px 0px'}).observe($('#sentinelle'));

$('#appel-scroll').addEventListener('click',
  () => $('#debut-carte').scrollIntoView({behavior:'smooth', block:'start'}));

/* mouvement réduit : on garde l'affiche fixe plutôt que la vidéo */
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  film.removeAttribute('autoplay');
  film.pause();
} else {
  /* certains navigateurs refusent la lecture auto : on réessaie au premier contact */
  const lancer = () => film.play().catch(() => {});
  film.addEventListener('canplay', lancer, {once:true});
  ['touchstart','click','scroll'].forEach(ev =>
    document.addEventListener(ev, lancer, {once:true, passive:true}));
}

/* on économise la batterie quand la vidéo n'est plus à l'écran */
new IntersectionObserver(([e]) => {
  if (e.isIntersecting) film.play().catch(() => {}); else film.pause();
}, {threshold: 0.1}).observe($('#cine'));

/* ============================================================
   11. FEUILLE GOOGLE — prix, textes et disponibilité
   La carte inscrite plus haut reste la référence de secours :
   si la feuille ne répond pas, le site fonctionne quand même.
   ============================================================ */

/* analyseur CSV : gère les guillemets, virgules et retours à la ligne internes */
function analyserCSV(txt){
  const lignes = [];
  let champ = '', ligne = [], guill = false;
  txt = txt.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
  for (let i = 0; i < txt.length; i++){
    const c = txt[i];
    if (guill){
      if (c === '"'){ if (txt[i+1] === '"'){ champ += '"'; i++; } else guill = false; }
      else champ += c;
    } else if (c === '"') guill = true;
    else if (c === ','){ ligne.push(champ); champ = ''; }
    else if (c === '\n'){ ligne.push(champ); lignes.push(ligne); ligne = []; champ = ''; }
    else champ += c;
  }
  if (champ !== '' || ligne.length){ ligne.push(champ); lignes.push(ligne); }
  if (!lignes.length) return [];
  const entetes = lignes.shift().map(e => sansAccents(e.trim()));
  return lignes.filter(l => l.some(v => v.trim()))
               .map(l => Object.fromEntries(entetes.map((e,i) => [e, (l[i] || '').trim()])));
}

/* « 12,5 » « 12.50 » « 45 DT » « 1 250 » -> nombre */
function lirePrix(v){
  let s = String(v).replace(/[^\d.,]/g, '').trim();
  if (!s) return null;
  const dp = s.lastIndexOf('.'), dv = s.lastIndexOf(',');
  const sep = Math.max(dp, dv);
  if (sep > -1 && s.length - sep - 1 <= 2)      // le dernier séparateur est décimal
    s = s.slice(0, sep).replace(/[.,]/g, '') + '.' + s.slice(sep + 1);
  else s = s.replace(/[.,]/g, '');
  const n = parseFloat(s);
  return isFinite(n) && n >= 0 ? n : null;
}

const estNon = v => ['non','no','0','faux','false','n'].includes(sansAccents(String(v).trim()));

/* La colonne « photo » accepte trois formes :
   - un nom de fichier posé à côté d'index.html   -> "pizzas-3.jpg"
   - un lien de partage Google Drive ou Dropbox   -> converti en lien direct
   - une adresse d'image quelconque               -> utilisée telle quelle
   Un lien de partage brut ne s'affiche pas dans une balise <img> : Drive
   renvoie une page web, pas l'image. D'où la conversion ci-dessous. */
function normaliserPhoto(v){
  const s = String(v || '').trim();
  if (!s) return '';

  const drive = s.match(/drive\.google\.com\/(?:file\/d\/|.*[?&]id=)([\w-]{20,})/);
  if (drive) return `https://drive.google.com/thumbnail?id=${drive[1]}&sz=w1000`;

  if (/dropbox\.com/.test(s)){
    const net = s.replace(/[?&]dl=\d/, '');           // on retire dl=0 avant de tester le « ? »
    return net + (net.includes('?') ? '&' : '?') + 'raw=1';
  }

  /* on n'accepte que http(s) ou un simple nom de fichier : la feuille est une
     source externe, pas question d'y laisser passer un javascript: */
  if (/^https?:\/\//i.test(s)) return s;
  if (/^[\w.-]+\.(jpe?g|png|webp|avif|gif)$/i.test(s)) return s;
  return '';
}

function appliquerFeuille(lignes){
  const parId = {};
  CARTE.forEach(g => g.cats.forEach(c => c.plats.forEach(p => parId[p.id] = p)));
  const parCat = {};
  CARTE.forEach(g => g.cats.forEach(c => parCat[c.id] = c));

  let modifs = 0, ajouts = 0, retires = 0;

  lignes.forEach(l => {
    const id = (l.id || '').trim();
    if (!id) return;
    let p = parId[id];

    /* identifiant inconnu : on ajoute l'article si sa rubrique existe (ex. « pizzas-90 ») */
    if (!p){
      const cat = parCat[id.slice(0, id.lastIndexOf('-'))];
      if (!cat || !(l.plat || '').trim()) return;
      p = { id, n:'', d:'', p:0, t:'', img:'' };
      cat.plats.push(p); parId[id] = p; ajouts++;
    }

    if (l.plat)                          p.n   = l.plat;
    if (l.description !== undefined)     p.d   = l.description;
    if (l.etiquette   !== undefined)     p.t   = l.etiquette;
    if (l.photo       !== undefined)     p.img = normaliserPhoto(l.photo);
    const prix = lirePrix(l.prix);
    if (prix !== null && prix !== p.p){ p.p = prix; modifs++; }

    const off = l.disponible !== undefined && l.disponible !== '' && estNon(l.disponible);
    if (off !== !!p.off){ p.off = off; if (off) retires++; }
  });

  console.info(`Feuille appliquée : ${modifs} prix, ${ajouts} ajout(s), ${retires} article(s) masqué(s).`);
  return true;
}

async function chargerFeuille(){
  if (!CONFIG.feuille) return;
  const ctrl = new AbortController();
  const minuteur = setTimeout(() => ctrl.abort(), 6000);
  try {
    /* l'horodatage contourne le cache de Google, sinon une correction met 5 min à sortir */
    const url = CONFIG.feuille + (CONFIG.feuille.includes('?') ? '&' : '?') + 'v=' + Date.now();
    const r = await fetch(url, {signal: ctrl.signal, cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const lignes = analyserCSV(await r.text());
    if (!lignes.length) throw new Error('feuille vide');
    if (!('id' in lignes[0]) || !('prix' in lignes[0]))
      throw new Error('colonnes « id » et « prix » introuvables');

    appliquerFeuille(lignes);
    rendre();
    const m = $('#maj');
    if (m) m.textContent = 'Carte à jour · ' +
      new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
  } catch (e) {
    /* panne de Google, hors ligne, feuille dépubliée : la carte locale reste affichée */
    console.warn('Feuille Google non appliquée, carte locale conservée :', e.message);
  } finally {
    clearTimeout(minuteur);
  }
}

/* on affiche d'abord la carte locale — le menu n'attend jamais le réseau —
   puis on rejoue le rendu si la feuille apporte du neuf */
rendre();
chargerFeuille();
